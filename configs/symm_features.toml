# Experiments (symmetry field target + dgedi input). Each section is a folder name:
#   {POSE6D_ROOT}/experiments/{section}/{input,target}
# Every instance of the pT version is included; object/scene selection happens at training.
#   pT                 section of pT_extract.toml
#   dgedi_dim          32 or 64, forwarded to the dgedi command
#   canonical_samples  points sampled on the mesh for the canonical field (default 20000)
#   seed               seed of that sampling (default 0)

[scalarfield_exp3]
pT = "rm_outliers_20_2_visib_10"
dgedi_dim = 32
