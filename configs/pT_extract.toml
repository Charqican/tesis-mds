# Changing the parameters of a version that already exists on disk is an error, you should create a new section instead.

# LEGACY (scalarfield_exp3*, scalarfield_inference*). On the server, lmo and pbr 0-49 were
# extracted with the extractor before c286788 (min points checked before outlier removal),
# which kept 1108 instances padded with zero rows. Kept so the exp3 runs still find their pT.
[rm_outliers_20_2_visib_10]
min_visib = 0.10
n_points = 1024
outliers = { nb_neighbors = 20, std = 2.0 }

[[rm_outliers_20_2_visib_10.sources]]
dataset = "pbr"
scenes = "2-3"

[[rm_outliers_20_2_visib_10.sources]]
dataset = "lmo"
scenes = [2]

# server-norm branch: ycbv is only used for inference, not needed to train the _norm runs
# [[rm_outliers_20_2_visib_10.sources]]
# dataset = "ycbv"
# scenes = "48-59"

# Same parameters as the legacy version, extracted with the current extractor (min points
# checked after outlier removal, no padded clouds). Used from scalarfield_exp4 on.
# Each machine extracts only what it has, e.g. --scenes lmo:2 pbr:0-49 on the server
# and --scenes tless:1-20 tless-pbr:0 locally.
[rm_outliers_20_2_visib_10_v2]
min_visib = 0.10
n_points = 1024
outliers = { nb_neighbors = 20, std = 2.0 }

[[rm_outliers_20_2_visib_10_v2.sources]]
dataset = "lmo"
scenes = [2]

[[rm_outliers_20_2_visib_10_v2.sources]]
dataset = "pbr"
scenes = "0-49"

# T-LESS real test (BOP19, primesense): objects with a single 180° symmetry
[[rm_outliers_20_2_visib_10_v2.sources]]
dataset = "tless"
scenes = "1-20"

# 50 scenes x 1000 images in train_pbr: start with one and add more as dgedi time allows
[[rm_outliers_20_2_visib_10_v2.sources]]
dataset = "tless-pbr"
scenes = [0]
